conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - docs/PLATFORM_CONFORMANCE.md
    - docs/provider-adapter-architecture.md
    - docs/provider-capability-contract.md
