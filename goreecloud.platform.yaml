health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define and validate the complete GoreeCloud Mail-owned backup scope across durable SQLite state, configuration, minimized security provenance, and other authorized local/trusted-backend state.
      - Keep external-provider-authoritative mailbox content and provider credentials within their respective authority and custody boundaries rather than treating Mail backup as a second authoritative mailbox.
      - Establish accepted Everkeep backup evidence and target-environment recovery procedures before production readiness.
  restore:
    required: true
    requirements:
      - Implement and validate a documented restore path for all approved Mail-owned durable state covered by backup.
      - Preserve account isolation, provider-account ownership, migration integrity, minimized security provenance, and credential-reference boundaries during restore.
      - Execute representative target-environment restore and rollback drills before recovery or Stable qualification is claimed.
  export:
    required: true
    requirements:
      - Preserve provider-independent portability for Mail-owned configuration and supported user-controlled application state through versioned documented formats where applicable.
      - Do not represent external-provider mailbox hosting or Internet mail transport as GoreeCloud Mail-owned export authority.
  portability:
    required: true
    requirements:
      - Keep the Courier provider abstraction independent from Gmail-specific assumptions and fail closed when an account lacks an authorized provider capability.
      - Define migration and portability behavior for Mail-owned durable state, configuration, and future native clients without transferring external-provider authority into GoreeCloud Mail.
      - Validate Linux and Android client portability only after those first-party client implementations exist and pass governed acceptance.

external_dependencies:
  - name: Node.js
    purpose: Development trusted-backend runtime and automated validation.
    required: true
    version_constraint: ">=22"
  - name: Compatible external email provider
    purpose: Authoritative mailbox hosting and Internet mail transport through approved provider APIs or standards-based protocols.
    required: true
    version_constraint: null
  - name: Wardveil Scan
    purpose: Required security authority for the currently guarded incoming and outgoing attachment admission paths when those paths are enabled.
    required: true
    version_constraint: null

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: "1.6.0"
  requires:
    - goreecloud-platform-contract==0.4
    - glaze-ui==1.6.0
    - node>=22
  provides:
    - courier.provider-capabilities/1

