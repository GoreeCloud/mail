    - clients/android/BUILD_STATUS.md
  blockers:
    - Mail's implemented web presentation remains historical V1.1 / 1.1.0 Development source while current mandatory Stable target is GLAZE UI V1.6 / 1.6.0; deliberate migration plus fresh rendered/accessibility/responsive/representative-environment/Human Visual Excellence/rollback/release acceptance remains outstanding.
    - GoreeCloud Manager integration and acceptance are not established.
    - Privacy Shield runtime/policy integration and production privacy acceptance are not established.
    - Wardveil attachment enforcement is bounded and runtime-validated only for the controlled-provider consumer matrix; real Gmail execution, production identity/credential lifecycle, authoritative Audit/Security Center provenance, quarantine, and broad production acceptance remain outstanding.
    - Everkeep integration, complete Mail-owned backup scope, restore implementation, representative recovery drills, rollback, and production continuity acceptance remain incomplete.
    - GoreeCloud Mesh registration, capability/event publication, authenticated delivery, and runtime acceptance are not established.
    - GoreeCloud Identity application authentication and production service/browser/provider-credential custody acceptance are not established; provider authorization remains a separate authority.
    - GoreeCloud Policy runtime decision, distribution, enforcement-coordination, explanation, freshness, exception, and evidence integration/acceptance are not established.
    - GoreeCloud Observability health, readiness, provider dependency-health, metrics/events, diagnostics, performance, provenance/freshness, alerting, and target-environment acceptance are not established.
    - The trusted Mail API does not yet publish a complete versioned Platform Contract API declaration or accepted health/readiness interfaces.
    - Real Gmail and standards-based IMAP/SMTP provider execution and production interoperability remain unaccepted.
    - The Linux first-party client and Android Gradle application are not complete; clients/android/BUILD_STATUS.md explicitly records the Android application implementation as pending.
    - Complete offline queue/replay, synchronization conflict handling, provider production observability, upgrade/rollback, account-isolation acceptance, and security/privacy failure-mode validation remain incomplete.
    - Production signing, artifact provenance, deployment approval, representative target-environment acceptance, Release Candidate entry, and Stable qualification remain outstanding.
