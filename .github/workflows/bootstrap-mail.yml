name: Bootstrap GoreeCloud Mail
on:
  push:
    branches:
      - feat/mailspring-fork-to-native-foundation
    paths:
      - .github/workflows/bootstrap-mail.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mailspring-fork-to-native-foundation
      - name: Configure commit identity
        run: |
          git config user.name "GoreeCloud"
          git config user.email "295260680+GoreeCloud@users.noreply.github.com"
      - name: Import upstream foundation
        run: bash scripts/goreecloud-bootstrap.sh
# Triggered after deterministic bootstrap script landed.
