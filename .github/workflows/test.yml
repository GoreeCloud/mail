name: GoreeCloud Mail CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out GoreeCloud Mail
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Audit runtime dependency advisories
        run: npm audit --omit=dev --audit-level=high

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out GoreeCloud Mail
        uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64 \
            libtidy5deb1 \
            binutils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GoreeCloud policy checks
        run: npm run policy:check

      - name: Run lint
        run: npm run lint:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Allow Electron namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Inspect downloaded Mailsync engine without execution
        run: |
          stat -c 'Mailsync mode: %A; size: %s bytes' app/mailsync
          file app/mailsync
          file app/mailsync.bin
          readelf -h app/mailsync.bin

      - name: Run tests
        run: dbus-launch --exit-with-session xvfb-run -a npm test
        timeout-minutes: 20