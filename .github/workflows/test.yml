name: GoreeCloud Mail CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mail-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pinned GPLv3 engine source
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Verify GoreeCloud Mail engine patch applies cleanly
        run: bash scripts/prepare-native-mailsync.sh

  engine-native-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out pinned GoreeCloud Mail native source
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install native engine build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            autoconf automake build-essential clang cmake fakeroot \
            git libc-ares-dev libctemplate-dev libcurl4-openssl-dev \
            libglib2.0-dev libicu-dev liblzma-dev libsasl2-dev libssl-dev \
            libsasl2-modules libsasl2-modules-gssapi-mit \
            libtidy-dev libtool libxext-dev libxkbfile-dev libxml2-dev \
            libxtst-dev rpm uuid-dev xvfb
      - name: Apply reviewed GoreeCloud native source patch
        run: bash scripts/prepare-native-mailsync.sh
      - name: Build native engine from patched source
        run: |
          chmod +x mailsync/build.sh
          (cd mailsync && ./build.sh)
      - name: Inspect native engine artifact
        run: |
          test -x app/mailsync
          test -x app/mailsync.bin
          file app/mailsync app/mailsync.bin
          readelf -h app/mailsync.bin
          sha256sum app/mailsync.bin
      - name: Exercise sterile engine migration outside legacy product paths
        run: |
          set -eu
          test_dir="$(mktemp -d "${RUNNER_TEMP}/goreecloud-mail-migrate.XXXXXXXX")"
          trap 'rm -rf "$test_dir"' EXIT
          CONFIG_DIR_PATH="$test_dir" \
          IDENTITY_SERVER="http://127.0.0.1:9" \
            ./app/mailsync --mode migrate
          test -f "$test_dir/edgehill.db" || test -f "$test_dir/Edgehill.db" || \
            { echo "Native migration completed but no known database file was detected."; exit 1; }


      - name: Transfer ephemeral source-built engine for app tests
        uses: actions/upload-artifact@v7
        with:
          name: goreecloud-mail-native-ci
          path: |
            app/mailsync
            app/mailsync.bin
            app/*.so*
          if-no-files-found: error
          retention-days: 1

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out GoreeCloud Mail
        uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            xvfb \
            dbus-x11 \
            libgbm1 \
            libnss3 \
            libasound2t64 \
            libatk1.0-0t64 \
            libatk-bridge2.0-0t64 \
            libgtk-3-0t64

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run GoreeCloud policy checks
        run: npm run policy:check

      - name: Run lint
        run: npm run lint:check

      - name: Run typecheck
        run: npm run typecheck

      - name: Allow Electron namespace sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run tests
        run: dbus-launch --exit-with-session xvfb-run -a npm test
        timeout-minutes: 20